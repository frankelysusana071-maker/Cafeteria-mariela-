<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería Mariela ☕</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
        html{scroll-behavior:smooth;}
        body{background:#24150e;color:#fff;min-height:100vh;}
        
        /* FONDO */
        body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(25,14,8,.82),rgba(25,14,8,.90)),url("fondo.jpg")center/cover no-repeat;z-index:-1;}
        
        /* HEADER */
        .header{position:sticky;top:0;z-index:1000;background:rgba(45,25,15,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,210,160,.15);}
        .header-inner{max-width:1150px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px;}
        .logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:#ffe4c2;}
        .logo span{font-size:28px;}
        .header-buttons{display:flex;gap:8px;}
        .icon-btn{width:45px;height:45px;border:0;border-radius:50%;background:#5c3722;color:white;font-size:20px;cursor:pointer;position:relative;}
        .cart-count{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;border-radius:20px;background:#25d366;color:white;font-size:12px;display:flex;justify-content:center;align-items:center;font-weight:bold;}
        
        /* HERO */
        .hero{max-width:1150px;margin:auto;padding:55px 18px 35px;text-align:center;}
        .hero h1{font-size:clamp(2.3rem,8vw,4.5rem);color:#ffe9d0;margin-bottom:10px;text-shadow:0 5px 20px rgba(0,0,0,.6);}
        .hero p{color:#d8bda2;font-size:clamp(1rem,3vw,1.3rem);margin-bottom:25px;}
        .hero-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 25px;border-radius:50px;background:#25d366;color:white;text-decoration:none;font-weight:bold;box-shadow:0 8px 25px rgba(37,211,102,.2);margin:5px;}
        .admin-btn{background:#d49a62;color:#29180e;}
        
        /* BUSCADOR */
        .search-box{max-width:650px;margin:10px auto 25px;position:relative;}
        .search-box input{width:100%;padding:16px 20px 16px 48px;border:1px solid rgba(255,255,255,.12);border-radius:50px;background:rgba(255,255,255,.1);color:white;outline:none;font-size:16px;}
        .search-icon{position:absolute;left:19px;top:15px;font-size:18px;}
        
        /* CATEGORÍAS */
        .categories{position:sticky;top:70px;z-index:900;overflow-x:auto;padding:10px 15px;background:rgba(35,20,12,.95);scrollbar-width:none;}
        .categories::-webkit-scrollbar{display:none;}
        .categories-inner{max-width:1150px;margin:auto;display:flex;gap:9px;}
        .category{flex:0 0 auto;padding:10px 16px;border:1px solid #795337;border-radius:30px;color:#e8d0b5;background:#392216;cursor:pointer;white-space:nowrap;font-weight:bold;}
        .category.active,.category:hover{background:#d49a62;color:#29180e;}
        
        /* CONTENIDO */
        .container{max-width:1150px;margin:auto;padding:15px 18px 100px;}
        .section{margin:28px 0 45px;scroll-margin-top:140px;}
        .section-title{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:25px;color:#f3d1ac;}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
        
        /* PRODUCTO */
        .product{background:rgba(63,38,23,.9);border:1px solid rgba(255,210,160,.1);border-radius:18px;overflow:hidden;box-shadow:0 8px 25px rgba(0,0,0,.2);transition:.25s;}
        .product:hover{transform:translateY(-4px);box-shadow:0 15px 30px rgba(0,0,0,.3);}
        .product-image{width:100%;height:200px;object-fit:cover;display:block;background:#543621;}
        .product-info{padding:17px;}
        .product-name{font-size:18px;font-weight:bold;color:#ffe6c8;margin-bottom:7px;}
        .product-desc{color:#bca795;font-size:14px;min-height:35px;line-height:1.4;margin-bottom:10px;}
        .product-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;}
        .price{color:#ffd28f;font-size:20px;font-weight:800;}
        .add-btn{border:0;background:#25d366;color:white;padding:10px 14px;border-radius:10px;font-weight:bold;cursor:pointer;font-size:14px;}
        
        /* CARRITO */
        .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;display:none;}
        .cart-overlay.show{display:block;}
        .cart{position:absolute;right:0;top:0;width:min(430px,100%);height:100%;background:#2b190f;box-shadow:-10px 0 40px rgba(0,0,0,.5);display:flex;flex-direction:column;}
        .cart-header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #563824;}
        .cart-header h2{color:#ffe2bf;}
        .close-cart{border:0;background:#51301e;color:white;width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer;}
        .cart-items{flex:1;overflow-y:auto;padding:15px;}
        .cart-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #503421;}
        .cart-item img{width:65px;height:65px;object-fit:cover;border-radius:10px;}
        .cart-item-info{flex:1;}
        .cart-item-name{font-weight:bold;margin-bottom:5px;}
        .cart-item-price{color:#ffd28f;}
        .quantity{display:flex;align-items:center;gap:8px;margin-top:7px;}
        .quantity button{width:28px;height:28px;border:0;border-radius:7px;background:#67432b;color:white;font-weight:bold;cursor:pointer;}
        .empty{text-align:center;color:#bca795;padding:50px 20px;}
        .cart-footer{padding:18px;border-top:1px solid #563824;background:#24150d;}
        .total{display:flex;justify-content:space-between;font-size:21px;font-weight:bold;margin-bottom:15px;}
        .total span:last-child{color:#ffd28f;}
        .delivery-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px dashed #503421;margin:10px 0;}
        .notes-area{width:100%;padding:12px;border-radius:10px;border:1px solid #563824;background:rgba(255,255,255,.05);color:white;margin:10px 0;resize:none;}
        .checkout{width:100%;border:0;padding:15px;border-radius:12px;background:#25d366;color:white;font-size:17px;font-weight:bold;cursor:pointer;}
        
        /* WHATSAPP FLOTANTE */
        .whatsapp{position:fixed;right:18px;bottom:18px;z-index:1500;width:58px;height:58px;border-radius:50%;background:#25d366;color:white;display:flex;align-items:center;justify-content:center;font-size:29px;text-decoration:none;box-shadow:0 8px 25px rgba(0,0,0,.4);}
        
        /* FOOTER */
        footer{text-align:center;padding:40px 20px 80px;color:#cbb5a0;}
        footer h3{color:#ffe0bd;margin-bottom:12px;}
        
        /* RESPONSIVE */
        @media(max-width:600px){
            .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;}
            .product-image{height:145px;}
            .hero h1{font-size:2.4rem;}
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo"><span>☕</span> Cafetería Mariela</div>
        <div class="header-buttons">
            <button class="icon-btn" onclick="abrirCarrito()">🛒<span class="cart-count" id="cartCount">0</span></button>
        </div>
    </div>
</header>

<section class="hero">
    <h1>☕ Cafetería Mariela</h1>
    <p>El sabor que te gusta, hecho con cariño ❤️</p>
    <a class="hero-btn" href="https://wa.me/18093439670" target="_blank">💬 WhatsApp</a>
</section>

<div class="search-box">
    <span class="search-icon">🔎</span>
    <input type="search" id="search" placeholder="Buscar producto..." oninput="buscarProductos()">
</div>

<nav class="categories">
    <div class="categories-inner" id="categoriasNav">
        <button class="category active" onclick="filtrar('todos',this)">Todos</button>
        <button class="category" onclick="filtrar('tostadas',this)">🍞 Tostadas</button>
        <button class="category" onclick="filtrar('empanadas',this)">🥟 Empanadas</button>
        <button class="category" onclick="filtrar('jugos',this)">🍊 Jugos</button>
        <button class="category" onclick="filtrar('refrescos',this)">🥤 Refrescos</button>
        <button class="category" onclick="filtrar('cafes',this)">☕ Cafés</button>
        <button class="category" onclick="filtrar('agua',this)">💧 Agua</button>
    </div>
</nav>

<main class="container" id="productosContainer"></main>

<footer>
    <h3>📍 Cafetería Mariela</h3>
    <p>🕐 Abierto todos los días: 7:00 AM – 8:00 PM</p>
    <p>📲 WhatsApp: +1 809 343 9670</p>
    <p>❤️ Gracias por preferirnos</p>
</footer>

<a class="whatsapp" href="https://wa.me/18093439670" target="_blank">💬</a>

<!-- CARRITO -->
<div class="cart-overlay" id="cartOverlay" onclick="cerrarSiFuera(event)">
    <aside class="cart">
        <div class="cart-header">
            <h2>🛒 Tu pedido</h2>
            <button class="close-cart" onclick="cerrarCarrito()">✕</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer">
            <div class="delivery-row" id="deliveryRow" style="display:none;">
                <span>🚚 Envío a domicilio: RD$ 50</span>
                <label style="display:flex;align-items:center;gap:8px;">
                    <input type="checkbox" id="deliveryCheck" onchange="actualizarTotal()">
                    Activar
                </label>
            </div>
            <textarea class="notes-area" id="pedidoNotas" placeholder="📝 Notas o instrucciones especiales..."></textarea>
            <div class="total">
                <span>Total</span>
                <span id="cartTotal">RD$ 0</span>
            </div>
            <button class="checkout" onclick="enviarPedido()">💬 Enviar Pedido por WhatsApp</button>
        </div>
    </aside>
</div>

<script>
// =============================================
// 📦 AQUÍ ESTÁN TUS PRODUCTOS - EDITA ESTA LISTA CUANDO QUIERAS
// =============================================
const productos = [
    // === TOSTADAS ===
    {id:1,categoria:"tostadas",nombre:"jamon queso y pollo",descripcion:"2 doble carne",precio:140,imagen:"tostada1.jpg"},
    {id:2,categoria:"tostadas",nombre:"jamon queso y repollo",descripcion:"Pan tostado con queso derretido",precio:100,imagen:"tostada2.jpg"},
    {id:3,categoria:"tostadas",nombre:"jamon y queso",descripcion:"Pan con jamon y queso derretido",precio:60,imagen:"tostada3.jpg"},
    {id:3,categoria:"tostadas",nombre:"Extra grande",descripcion:"Pan con jamon,queso,repollo,pollo",precio:150,imagen:"tostada4.jpg"},
    // === EMPANADAS ===
    {id:4,categoria:"empanadas",nombre:"Empanada de Carne",descripcion:"Rellena de carne sazonada",precio:80,imagen:"empanada1.jpg"},
    {id:5,categoria:"empanadas",nombre:"Empanada de Pollo",descripcion:"Rellena de pollo desmenuzado",precio:80,imagen:"empanada2.jpg"},
    {id:6,categoria:"empanadas",nombre:"Empanada de Queso",descripcion:"Rellena de queso cremoso",precio:70,imagen:"empanada3.jpg"},
    {id:7,categoria:"empanadas",nombre:"Jamón y Queso",descripcion:"Rellena de jamón y queso",precio:90,imagen:"empanada4.jpg"},
    {id:8,categoria:"empanadas",nombre:"Empanada de pizza",descripcion:"Rellena de cerdo sazonado",precio:85,imagen:"empanada5.jpg"},
    
    // === JUGOS ===
    {id:9,categoria:"jugos",nombre:"Jugo de limon",descripcion:"precio:100,imagen:"jugo1.jpg"},
    {id:10,categoria:"jugos",nombre:"Jugo de Chinola",descripcion:"",precio:100,imagen:"jugo2.jpg"},
    {id:11,categoria:"jugos",nombre:"Jugo de avena y chinola",descripcion:"",precio:100,imagen:"jugo3.jpg"},
    {id:12,categoria:"jugos",nombre:"Jugo de piña",descripcion:"Suave y refrescante",precio:100,imagen:"jugo4.jpg"},
    {id:13,categoria:"jugos",nombre:"Jugo de tamarindo",descripcion:"Natural y refrescante",precio:100,imagen:"jugo5.jpg"},
    {id:13,categoria:"jugos",nombre:"Jugo de avena",descripcion:"Natural y refrescante",precio:100,imagen:"jugo6.jpg"},
    
    // === REFRESCOS ===
    {id:14,categoria:"refrescos",nombre:"Refresco de Cola",descripcion:"Bien frío",precio:30,imagen:"refresco1.jpg"},
    {id:17,categoria:"refrescos",nombre:"Refresco de Limón",descripcion:"Refrescante y ligero",precio:30,imagen:"refresco4.jpg"},
  
    // === CAFÉS ===
    {id:19,categoria:"cafes",nombre:"Café Negro",descripcion:"Café puro y aromático",precio:25,imagen:"cafe1.jpg"},
    {id:20,categoria:"cafes",nombre:"Café con Leche",descripcion:"Café mezclado con leche",precio:30,imagen:"cafe2.jpg"},
    
    // === AGUA ===
    {id:24,categoria:"agua",nombre:"Agua Natural",descripcion:"Botella de agua pura y fresca",precio:20,imagen:"agua1.jpg"},
    {id:25,categoria:"agua",nombre:"Gatorade",descripcion:"",precio:65,imagen:"agua2.jpg"}
];

const categoriasInfo = {
    tostadas:["🍞","Tostadas"],
    empanadas:["🥟","Empanadas"],
    jugos:["🍊","Jugos Naturales"],
    refrescos:["🥤","Refrescos"],
    cafes:["☕","Cafés"],
    agua:["💧","Agua"]
};

let carrito = JSON.parse(localStorage.getItem("carritoMariela")) || [];
let categoriaActual = "todos";
const COSTO_ENVIO = 50;
const DELIVERY_ACTIVO = true;

// =============================================
// 📦 MOSTRAR PRODUCTOS
// =============================================
function mostrarProductos(lista = productos){
    const container = document.getElementById("productosContainer");
    container.innerHTML = "";
    let grupos = {};
    lista.forEach(p=>{if(!grupos[p.categoria])grupos[p.categoria]=[];grupos[p.categoria].push(p);});
    Object.keys(grupos).forEach(cat=>{
        const section = document.createElement("section");
        section.className = "section";
        section.innerHTML = `<h2 class="section-title">${categoriasInfo[cat][0]} ${categoriasInfo[cat][1]}</h2>`;
        const grid = document.createElement("div");
        grid.className = "grid";
        grupos[cat].forEach(p=>{
            grid.innerHTML += `
                <article class="product">
                    <img src="${p.imagen}" alt="${p.nombre}" class="product-image" loading="lazy" onerror="this.src='https://via.placeholder.com/400x300/543621/ffffff?text=${encodeURIComponent(p.nombre)}'">
                    <div class="product-info">
                        <div class="product-name">${p.nombre}</div>
                        <div class="product-desc">${p.descripcion}</div>
                        <div class="product-bottom">
                            <span class="price">RD$ ${p.precio}</span>
                            <button class="add-btn" onclick="agregar(${p.id})">+ Agregar</button>
                        </div>
                    </div>
                </article>`;
        });
        section.appendChild(grid);
        container.appendChild(section);
    });
}

// =============================================
// 🛒 CARRITO
// =============================================
function agregar(id){
    const p = productos.find(x=>x.id===id);
    const existente = carrito.find(x=>x.id===id);
    if(existente)existente.cantidad++;
    else carrito.push({...p,cantidad:1});
    guardarCarrito(); actualizarCarrito(); abrirCarrito();
}
function cambiarCantidad(id, cant){
    const item = carrito.find(x=>x.id===id);
    if(!item)return;
    item.cantidad += cant;
    if(item.cantidad<=0)carrito = carrito.filter(x=>x.id!==id);
    guardarCarrito(); actualizarCarrito();
}
function guardarCarrito(){localStorage.setItem("carritoMariela",JSON.stringify(carrito));}
function actualizarCarrito(){
    const container = document.getElementById("cartItems");
    const count = carrito.reduce((t,i)=>t+i.cantidad,0);
    document.getElementById("cartCount").textContent = count;
    document.getElementById("deliveryRow").style.display = DELIVERY_ACTIVO?"flex":"none";
    if(carrito.length===0){
        container.innerHTML = `<div class="empty"><div style="font-size:50px">🛒</div><p>Tu carrito está vacío.</p><p>Agrega algo delicioso ☕</p></div>`;
        document.getElementById("cartTotal").textContent = "RD$ 0";
        return;
    }
    container.innerHTML = "";
    carrito.forEach(item=>{
        container.innerHTML += `
            <div class="cart-item">
                <img src="${item.imagen}" alt="${item.nombre}">
                <div class="cart-item-info">
                    <div class="cart-item-name">${item.nombre}</div>
                    <div class="cart-item-price">RD$ ${item.precio}</div>
                    <div class="quantity">
                        <button onclick="cambiarCantidad(${item.id},-1)">−</button>
                        <strong>${item.cantidad}</strong>
                        <button onclick="cambiarCantidad(${item.id},1)">+</button>
                    </div>
                </div>
            </div>`;
    });
    actualizarTotal();
}
function actualizarTotal(){
    let total = carrito.reduce((t,i)=>t+i.precio*i.cantidad,0);
    const conEnvio = document.getElementById("deliveryCheck")?.checked;
    if(conEnvio)total += COSTO_ENVIO;
    document.getElementById("cartTotal").textContent = "RD$ " + total.toLocaleString("es-DO");
}
function abrirCarrito(){document.getElementById("cartOverlay").classList.add("show");document.body.style.overflow="hidden";}
function cerrarCarrito(){document.getElementById("cartOverlay").classList.remove("show");document.body.style.overflow="";}
function cerrarSiFuera(e){if(e.target.id==="cartOverlay")cerrarCarrito();}

// =============================================
// 💬 ENVIAR PEDIDO POR WHATSAPP
// =============================================
function enviarPedido(){
    if(carrito.length===0){alert("Agrega productos primero");return;}
    let mensaje = "☕ *PEDIDO - CAFETERÍA MARIELA*%0A%0A";
    let total = 0;
    carrito.forEach(i=>{
        const subtotal = i.precio*i.cantidad;
        total += subtotal;
        mensaje += `▪️ ${i.cantidad}x ${i.nombre}%0A  RD$ ${subtotal}%0A`;
    });
    const conEnvio = document.getElementById("deliveryCheck")?.checked;
    if(conEnvio){
        mensaje += `%0A🚚 Envío a domicilio: RD$ ${COSTO_ENVIO}%0A`;
        total += COSTO_ENVIO;
    }
    const notas = document.getElementById("pedidoNotas")?.value?.trim();
    if(notas)mensaje += `%0A📝 Notas: ${encodeURIComponent(notas)}%0A`;
    mensaje += `%0A💰 *TOTAL: RD$ ${total.toLocaleString("es-DO")}*%0A%0A¡Hola! Quiero realizar este pedido.`;
    window.open(`https://wa.me/18093439670?text=${mensaje}`,"_blank");
}

// =============================================
// 🔍 FILTRAR Y BUSCAR
// =============================================
function filtrar(cat, btn){
    categoriaActual = cat;
    document.querySelectorAll(".category").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    if(cat==="todos")mostrarProductos(productos);
    else mostrarProductos(productos.filter(p=>p.categoria===cat));
    window.scrollTo({top:0,behavior:"smooth"});
}
function buscarProductos(){
    const t = document.getElementById("search").value.toLowerCase().trim();
    let lista = productos;
    if(categoriaActual!=="todos")lista = lista.filter(p=>p.categoria===categoriaActual);
    if(t)lista = lista.filter(p=>p.nombre.toLowerCase().includes(t)||p.descripcion.toLowerCase().includes(t));
    mostrarProductos(lista);
}

// =============================================
// 🚀 INICIO
// =============================================
mostrarProductos();
actualizarCarrito();
</script>

</body>
</html>
